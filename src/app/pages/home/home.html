<div class="layout">
  <aside class="sidebar">
    <app-tree [sports]="tree()" (hoursChanged)="onHoursChanged($event)" />
  </aside>

  <main class="content">
    @if (eventsLoading()) {
      <p>Loading events...</p>
    }

    @for (event of events(); track event.id) {
      <div class="event-card" [routerLink]="['/event', event.id]">
        <span>{{ event.homeTeam }} vs {{ event.awayTeam }}</span>
        <small>{{ event.startTime }} · {{ event.leagueName }}</small>
      </div>
    }

    @if (!eventsLoading() && events().length === 0) {
      <p>Select leagues to see events.</p>
    }
  </main>

  <aside class="betslip-section">
    <app-betslip />
  </aside>
</div>
